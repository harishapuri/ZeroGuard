name: ZeroGuard shadow gate

on:
  push:
  pull_request:

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Unit tests
        run: python3 -m unittest tests.test_zeroguard tests.test_automate -v
      - name: Automate all demo stories
        run: python3 -m zeroguard.automate
      - name: Shadow pass fixture
        run: |
          python3 -m zeroguard vendor/unified_framework/examples/checkov_pass.json \
            --telemetry vendor/unified_framework/examples/telemetry_ok.json \
            --service ci
